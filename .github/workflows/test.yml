name: Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        run: uv sync --all-extras --all-groups --frozen
      - name: Lint with ruff
        run: uv run ruff check --output-format=github .
      - name: Check formatting with ruff
        run: uv run ruff format --check .
      - name: Check types with mypy
        run: uv run mypy custom_components/indygo_pool
      - name: Scan dev dependencies for known vulnerabilities
        # Scoped to the `dev` dependency group (the only group with real,
        # scannable packages: `dependencies` is empty since HA provides
        # aiohttp etc. at runtime). `aiohttp` is excluded from the scan: it's
        # capped at <3.14 for aioresponses compatibility
        # (https://github.com/pnuckowski/aioresponses/issues/289, open), which
        # means it permanently carries known CVEs already fixed upstream in
        # 3.14+. pip-audit has no per-package suppression, only per-vuln-ID
        # `--ignore-vuln`, which would need a growing, hand-maintained list as
        # new CVEs get published against the same pinned version. Drop this
        # exclusion once the cap is lifted.
        run: |
          uv export --only-group dev --no-hashes --no-emit-project -o requirements-audit.txt
          grep -v '^aiohttp==' requirements-audit.txt > requirements-audit-filtered.txt
          uv run pip-audit -r requirements-audit-filtered.txt --disable-pip --no-deps
      - name: Run tests with coverage
        run: uv run pytest -m "not integration"
      - name: Determine declared requires-python floor
        id: floor
        run: echo "version=$(uv run python scripts/print_requires_python_floor.py)" >> "$GITHUB_OUTPUT"
      - name: Verify the declared floor actually resolves
        run: |
          uv python install "${{ steps.floor.outputs.version }}"
          uv sync --all-extras --all-groups --frozen --python "${{ steps.floor.outputs.version }}"
          uv run --python "${{ steps.floor.outputs.version }}" pytest -m "not integration"
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
