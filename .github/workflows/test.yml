name: Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        run: uv sync --all-extras --all-groups --frozen
      - name: Lint with ruff
        run: uv run ruff check --output-format=github .
      - name: Check formatting with ruff
        run: uv run ruff format --check .
      - name: Check types with mypy
        run: uv run mypy custom_components/indygo_pool
      - name: Scan dev dependencies for known vulnerabilities
        # Scoped to the `dev` dependency group (the only group with real,
        # scannable packages: `dependencies` is empty since HA provides
        # aiohttp etc. at runtime). The aiohttp findings below all stem from
        # the <3.14 cap needed for aioresponses compatibility
        # (https://github.com/pnuckowski/aioresponses/issues/289, open);
        # drop the ignores once that cap is lifted.
        run: |
          uv export --only-group dev --no-hashes --no-emit-project -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --disable-pip --no-deps \
            --ignore-vuln PYSEC-2026-237 \
            --ignore-vuln PYSEC-2026-2104 \
            --ignore-vuln PYSEC-2026-2105 \
            --ignore-vuln PYSEC-2026-2106 \
            --ignore-vuln PYSEC-2026-2107 \
            --ignore-vuln PYSEC-2026-2108 \
            --ignore-vuln PYSEC-2026-2109 \
            --ignore-vuln PYSEC-2026-2110 \
            --ignore-vuln PYSEC-2026-2111 \
            --ignore-vuln PYSEC-2026-2112 \
            --ignore-vuln PYSEC-2026-2113 \
            --ignore-vuln PYSEC-2026-3545 \
            --ignore-vuln PYSEC-2026-3546 \
            --ignore-vuln PYSEC-2026-3547
      - name: Run tests with coverage
        run: uv run pytest -m "not integration"
      - name: Determine declared requires-python floor
        id: floor
        run: echo "version=$(uv run python scripts/print_requires_python_floor.py)" >> "$GITHUB_OUTPUT"
      - name: Verify the declared floor actually resolves
        run: |
          uv python install "${{ steps.floor.outputs.version }}"
          uv sync --all-extras --all-groups --frozen --python "${{ steps.floor.outputs.version }}"
          uv run --python "${{ steps.floor.outputs.version }}" pytest -m "not integration"
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
