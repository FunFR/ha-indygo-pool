[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]
exclude = ["tests", "config", "docs"]

[project]
name = "ha-indygo-pool"
version = "0.0.0"
description = "Home Assistant integration for Indygo Pool"
requires-python = ">=3.14.2"
authors = [
    { name = "FunFR" }
]
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest-homeassistant-custom-component",
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
]

[dependency-groups]
dev = [
    "aiohttp>=3.14",
    "aioresponses>=0.7.8",
    "commitizen>=4.10.1",
    "python-dotenv>=1.2.1",
    "pytest-cov",
    "packaging>=24",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "PL"]
ignore = ["PLR0913"]

[tool.mypy]
python_version = "3.14"
# Tests mock HA/aioresponses internals in ways mypy can't model (attribute
# reassignment on final methods, etc.): scope enforcement to the integration
# code that CI actually runs mypy against.
exclude = ["^tests/"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "testing_config"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: tests that require real API credentials",
]
addopts = "-m 'not integration' --cov=custom_components.indygo_pool --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["custom_components/indygo_pool"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "try:",
    "except ImportError:",
]
